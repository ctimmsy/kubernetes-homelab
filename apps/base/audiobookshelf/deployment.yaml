apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.35.1
          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap
          ports:
            - containerPort: 3005
          volumeMounts:
            - mountPath: "/config"
              name: audiobookshelf-config
            - mountPath: "/metadata"
              name: audiobookshelf-metadata
            - mountPath: "/audiobooks"
              name: audiobookshelf-audiobooks
            - mountPath: "/books"
              name: audiobookshelf-books
            - mountPath: "/podcasts"
              name: audiobookshelf-podcasts
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: audiobookshelf-config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: audiobookshelf-metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
        - name: audiobookshelf-audiobooks
          persistentVolumeClaim:
            claimName: audiobookshelf-audiobooks
        - name: audiobookshelf-books
          persistentVolumeClaim:
            claimName: audiobookshelf-books
        - name: audiobookshelf-podcasts
          persistentVolumeClaim:
            claimName: audiobookshelf-podcasts
