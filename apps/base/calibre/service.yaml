# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: calibre
spec:
  selector:
    app: calibre
  ports:
    - port: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-wireless-server
spec:
  selector:
    app: calibre
  ports:
    - port: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
spec:
  selector:
    app: calibre
  ports:
    - port: 8083
  type: ClusterIP
