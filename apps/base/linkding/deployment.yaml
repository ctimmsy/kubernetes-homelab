apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.31.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - mountPath: "/etc/linkding/data"
              name: linkding-data
          securityContext:
            allowPrivilegeEscalation: false
          env:
          - name: LD_SUPERUSER_NAME
            valueFrom:
              secretKeyRef:
                name: ld-admin-credentials
                key: username
          - name: LD_SUPERUSER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ld-admin-credentials
                key: password
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data-pvc
