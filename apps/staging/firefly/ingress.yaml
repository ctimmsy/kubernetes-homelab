apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firefly
spec:
  ingressClassName: traefik
  rules:
    - host: "ffly.ctimms.net"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firefly-firefly-iii
                port:
                  number: 80
