apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-importer-script
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: firefly-importer
              image: ghcr.io/ctimmsy/firefly-importer:main
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: firefly-importer-configmap
                - secretRef:
                    name: ffly-importer-secrets
              volumeMounts:
                - mountPath: "/data"
                  name: firefly-importer-script-data
          volumes:
            - name: firefly-importer-script-data
              persistentVolumeClaim:
                claimName: firefly-importer-script-db-storage-claim
          restartPolicy: OnFailure
